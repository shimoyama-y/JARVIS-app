name: Build source release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Compile app modules
        run: python -m py_compile app.py ai.py features.py jarvis_tools.py
      - name: Run unit tests
        run: python -m pytest -q -p no:cacheprovider
  release:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          mkdir -p release
          git archive --format=zip --prefix=JARVIS/ HEAD -o release/JARVIS-source.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/JARVIS-source.zip
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-source
          path: release/JARVIS-source.zip
